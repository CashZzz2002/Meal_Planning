name: meal-planning

services:
  admin-api:
    build:
      context: .
      dockerfile: Admin/MealPlanning.Admin.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Enabled: "true"
      ConnectionStrings__MealPlanner: ${DATABASE_URL:?Run neon env pull --file .env.local}
      TZ: Asia/Yangon
    ports:
      - "5101:8080"

  user-api:
    build:
      context: .
      dockerfile: User/MealPlanning.User.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Enabled: "true"
      ConnectionStrings__MealPlanner: ${DATABASE_URL:?Run neon env pull --file .env.local}
      TZ: Asia/Yangon
    ports:
      - "5201:8080"

  admin-web:
    build:
      context: ./Admin/admin-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5101
      TZ: Asia/Yangon
    depends_on:
      - admin-api
    ports:
      - "3001:3000"

  user-web:
    build:
      context: ./User/user-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5201
      TZ: Asia/Yangon
    depends_on:
      - user-api
    ports:
      - "3002:3000"
